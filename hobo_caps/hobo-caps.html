<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobo Caps - European Bike Trip</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 1rem;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        #controls {
            padding: 1rem;
            background-color: #ecf0f1;
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #bdc3c7;
        }
        #map {
            flex-grow: 1;
            width: 100%;
        }
        button, select, input[type="file"] {
            padding: 0.5rem;
            font-size: 1rem;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <header>
        <h1>Hobo Caps</h1>
    </header>

    <div id="controls">
        <input type="file" id="gpxUpload" accept=".gpx">
        <select id="transportMode">
            <option value="bike">Bike (Solid Line)</option>
            <option value="train">Train (Dashed Line)</option>
        </select>
        <button id="addRouteBtn">Add Route</button>
        <button id="updateLocationBtn">Update Current Position</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
        // Initialize map centered roughly on Europe
        const map = L.map('map').setView([51.1657, 10.4515], 5);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Color palette to distinguish different days
        const colors = ['#e74c3c', '#2ecc71', '#9b59b6', '#f1c40f', '#e67e22', '#1abc9c', '#34495e'];
        let dayCount = 0;
        let currentLocationMarker = null;

        // Handle GPX Upload
        document.getElementById('addRouteBtn').addEventListener('click', () => {
            const fileInput = document.getElementById('gpxUpload');
            const mode = document.getElementById('transportMode').value;
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select a GPX file first.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const gpxData = e.target.result;
                
                // Select a color based on the day counter
                const routeColor = colors[dayCount % colors.length];
                
                // Use a dashed line for train trips, solid for biking
                const dashArrayStyle = mode === 'train' ? '10, 10' : '';

                new L.GPX(gpxData, {
                    async: true,
                    polyline_options: {
                        color: routeColor,
                        weight: 5,
                        opacity: 0.8,
                        dashArray: dashArrayStyle,
                        lineCap: 'round'
                    },
                    marker_options: {
                        startIconUrl: null, // Removes default start/end markers to keep map clean
                        endIconUrl: null,
                        shadowUrl: null
                    }
                }).on('loaded', function(e) {
                    // Automatically zoom the map to fit the newly uploaded route
                    map.fitBounds(e.target.getBounds());
                    
                    // Bind a popup to identify the day and mode
                    const layer = e.target.getLayers()[0];
                    if (layer) {
                        layer.bindPopup(`<b>Day ${dayCount + 1}</b><br>Mode: ${mode === 'train' ? 'Train' : 'Bike'}`);
                    }
                }).addTo(map);

                dayCount++;
                fileInput.value = ''; // Reset input
            };
            
            reader.readAsText(file);
        });

        // Handle Current Location Update
        document.getElementById('updateLocationBtn').addEventListener('click', () => {
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        // Remove existing location marker if it exists
                        if (currentLocationMarker) {
                            map.removeLayer(currentLocationMarker);
                        }

                        // Add new marker at current location
                        currentLocationMarker = L.marker([lat, lng]).addTo(map)
                            .bindPopup('<b>Your Current Position</b>')
                            .openPopup();

                        // Center map on current location
                        map.setView([lat, lng], 12);
                    }, 
                    error => {
                        console.error('Error getting location:', error);
                        alert('Unable to retrieve your location. Ensure location permissions are granted.');
                    },
                    { enableHighAccuracy: true }
                );
            } else {
                alert('Geolocation is not supported by your browser.');
            }
        });
    </script>
</body>
</html>
