<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobo Caps Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@3.1.4/Control.FullScreen.css" />
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.fullscreen@3.1.4/Control.FullScreen.min.js"></script>

    <script>
        // Initialize Map and Fullscreen Control
        const map = L.map('map', {
            fullscreenControl: true,
            fullscreenControlOptions: { position: 'topleft' }
        }).setView([51.1657, 10.4515], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Color definitions
        const bikeColors = ['#ff7777', '#ff4444', '#e62222', '#b31111', '#a80000']; 
        const trainColor = '#3355dd'; 

        // Make sure these match your new file names exactly
        const routes = [
            { file: 'day1.geojson', mode: 'bike', day: 1 },
            { file: 'day2.geojson', mode: 'bike', day: 2 },
            { file: 'day3.geojson', mode: 'bike', day: 3 },
            { file: 'day4.geojson', mode: 'bike', day: 4 },
            { file: 'TrainToHellerup.geojson', mode: 'train', day: 4 },
            { file: 'day5.geojson', mode: 'bike', day: 5 },
            { file: 'day6.geojson', mode: 'bike', day: 6 },
            { file: 'day7.geojson', mode: 'bike', day: 7 },
            { file: 'day8.geojson', mode: 'bike', day: 8 },
            { file: 'day9.geojson', mode: 'bike', day: 9 },
            { file: 'day10.geojson', mode: 'bike', day: 10 },
            { file: 'TrainToMunster.geojson', mode: 'train', day: 10 },
            { file: 'day11.geojson', mode: 'bike', day: 11 }
        ];

        let bounds = L.latLngBounds();

        // Array to hold all our fetch promises so we know when everything is done loading
        const routePromises = routes.map((route, index) => {
            return fetch(route.file)
                .then(response => {
                    if (!response.ok) throw new Error(`Could not load ${route.file}`);
                    return response.json();
                })
                .then(data => {
                    // --- JUMP-CUTTER LOGIC ---
                    // If distance between two points is > 3000 meters (3km), cut the line.
                    // You can adjust this number if you have smaller train jumps.
                    const jumpThreshold = 3000; 

                    const splitLine = (coords) => {
                        let segments = [];
                        let currentSegment = [coords[0]];
                        for (let i = 1; i < coords.length; i++) {
                            const p1 = L.latLng(coords[i-1][1], coords[i-1][0]);
                            const p2 = L.latLng(coords[i][1], coords[i][0]);
                            if (map.distance(p1, p2) > jumpThreshold) {
                                if (currentSegment.length > 1) segments.push(currentSegment);
                                currentSegment = [coords[i]]; // Start new segment
                            } else {
                                currentSegment.push(coords[i]);
                            }
                        }
                        if (currentSegment.length > 1) segments.push(currentSegment);
                        return segments;
                    };

                    if (data.features) {
                        data.features.forEach(feature => {
                            if (feature.geometry.type === 'LineString') {
                                feature.geometry.coordinates = splitLine(feature.geometry.coordinates);
                                feature.geometry.type = 'MultiLineString';
                            } else if (feature.geometry.type === 'MultiLineString') {
                                let newMulti = [];
                                feature.geometry.coordinates.forEach(line => {
                                    newMulti.push(...splitLine(line));
                                });
                                feature.geometry.coordinates = newMulti;
                            }
                        });
                    }
                    // --- END JUMP-CUTTER LOGIC ---

                    const isTrain = route.mode === 'train';
                    const routeColor = isTrain ? trainColor : bikeColors[index % bikeColors.length];
                    const dashArrayStyle = isTrain ? '10, 10' : '';

                    // Add the GeoJSON data to the map
                    const geoJsonLayer = L.geoJSON(data, {
                        style: function (feature) {
                            return {
                                color: routeColor,
                                weight: 6,
                                opacity: 0.8,
                                dashArray: dashArrayStyle,
                                lineCap: 'round'
                            };
                        },
                        onEachFeature: function (feature, layer) {
                            let popupContent = `<b>Day ${route.day}</b>`;
                            
                            // 1. Calculate Distance
                            let totalDistanceMeters = 0;
                            if (feature.geometry.type === 'LineString') {
                                const coords = feature.geometry.coordinates;
                                for (let i = 0; i < coords.length - 1; i++) {
                                    const p1 = L.latLng(coords[i][1], coords[i][0]);
                                    const p2 = L.latLng(coords[i+1][1], coords[i+1][0]);
                                    totalDistanceMeters += map.distance(p1, p2);
                                }
                            } else if (feature.geometry.type === 'MultiLineString') {
                                const lines = feature.geometry.coordinates;
                                lines.forEach(coords => {
                                    for (let i = 0; i < coords.length - 1; i++) {
                                        const p1 = L.latLng(coords[i][1], coords[i][0]);
                                        const p2 = L.latLng(coords[i+1][1], coords[i+1][0]);
                                        totalDistanceMeters += map.distance(p1, p2);
                                    }
                                });
                            }

                            if (totalDistanceMeters > 0) {
                                const distanceKm = (totalDistanceMeters / 1000).toFixed(1);
                                popupContent += `<br><small><b>Distance:</b> ${distanceKm} km</small>`;
                            }

                            // 2. Hunt for Time Data
                            let startTimeStr = null;
                            let endTimeStr = null;
                            const timeOptions = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                            const props = feature.properties || {};

                            const timeArray = props.coordTimes || props.times || props.time;

                            if (Array.isArray(timeArray) && timeArray.length > 0) {
                                const start = new Date(timeArray[0]);
                                const end = new Date(timeArray[timeArray.length - 1]);
                                startTimeStr = start.toLocaleString(undefined, timeOptions);
                                endTimeStr = end.toLocaleString(undefined, timeOptions);
                            } 

                            if (startTimeStr && endTimeStr && startTimeStr !== "Invalid Date") {
                                popupContent += `<br><small><b>Start:</b> ${startTimeStr}<br><b>End:</b> ${endTimeStr}</small>`;
                            }

                            layer.bindPopup(popupContent);
                        }
                    }).addTo(map);

                    // Expand the map boundaries to include this new route
                    bounds.extend(geoJsonLayer.getBounds());
                })
                .catch(error => console.error(error));
        });

        // Once all files are fetched and drawn, zoom the map to fit them all
        Promise.all(routePromises).then(() => {
            if (bounds.isValid()) {
                map.fitBounds(bounds);
            }
        });

        // Add static current position
        const currentLat = 51.420; 
        const currentLng = 6.884;  
        
        const popupHTML = `
            <div style="text-align: center;">
                <img src="../images/propic.jpg" alt="photo" style="width: 100px; border-radius: 8px; margin-top: 5px;">
            </div>
        `;

        L.marker([currentLat, currentLng]).addTo(map)
            .bindPopup(popupHTML)
            .openPopup();

    </script>

    
</body>
</html>
