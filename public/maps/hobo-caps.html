<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobo Caps Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/3.0.2/Control.FullScreen.min.css" />
    <style>
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
    }
    #map {
        height: 100%;
        width: 100%;
    }
</style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/3.0.2/Control.FullScreen.min.js"></script>

    <script>
        // Initialize Map and Fullscreen Control
        const map = L.map('map', {
            fullscreenControl: true,
            fullscreenControlOptions: {
                position: 'topleft'
            }
        }).setView([51.1657, 10.4515], 5);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Color definitions
        const bikeColors = ['#ff6666', '#ff3333', '#e60000', '#b30000', '#800000']; // Shades of red
        const trainColor = '#3366ff'; // Blue

        const routes = [
            { file: 'day1.gpx', mode: 'bike', day: 1 },
            { file: 'day2.gpx', mode: 'bike', day: 2 },
            { file: 'day3.gpx', mode: 'bike', day: 3 },
            { file: 'day4.gpx', mode: 'bike', day: 4 },
            { file: 'day5.gpx', mode: 'bike', day: 5 },
            { file: 'day6.gpx', mode: 'bike', day: 6 },
            { file: 'day7.gpx', mode: 'bike', day: 7 },
            { file: 'day8.gpx', mode: 'bike', day: 8 },
            { file: 'day9.gpx', mode: 'bike', day: 9 }
        ];

        let bounds = L.latLngBounds();

        routes.forEach((route, index) => {
            // Assign colors based on mode
            const isTrain = route.mode === 'train';
            const routeColor = isTrain ? trainColor : bikeColors[index % bikeColors.length];
            const dashArrayStyle = isTrain ? '10, 10' : '';

            new L.GPX(route.file, {
                async: true,
                polyline_options: {
                    color: routeColor,
                    weight: 5,
                    opacity: 0.8,
                    dashArray: dashArrayStyle,
                    lineCap: 'round'
                },
                marker_options: {
                    startIconUrl: null, 
                    endIconUrl: null,
                    shadowUrl: null
                }
            }).on('loaded', function(e) {
                bounds.extend(e.target.getBounds());
                map.fitBounds(bounds);
                
                // Extract Start and End Times
                const startTime = e.target.get_start_time();
                const endTime = e.target.get_end_time();
                
                let timeInfo = '';
                if (startTime && endTime) {
                    // Format the dates (e.g., "Aug 15, 08:30")
                    const timeOptions = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
                    const startStr = startTime.toLocaleString(undefined, timeOptions);
                    const endStr = endTime.toLocaleString(undefined, timeOptions);
                    timeInfo = `<br><small><b>Start:</b> ${startStr}<br><b>End:</b> ${endStr}</small>`;
                }

                const layer = e.target.getLayers()[0];
                if (layer) {
                    // Bind popup without the explicit 'Mode' text
                    layer.bindPopup(`<b>Day ${route.day}</b>${timeInfo}`);
                }
            }).addTo(map);
        });

        // Add static current position
        const currentLat = 51.9607; 
        const currentLng = 7.6261;  
        
        L.marker([currentLat, currentLng]).addTo(map)
            .bindPopup('<b>Current Position</b>')
            .openPopup();

    </script>

    
</body>
</html>
