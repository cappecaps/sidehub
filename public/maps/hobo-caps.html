<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobo Caps Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/3.0.2/Control.FullScreen.min.css" />
    
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.fullscreen/3.0.2/Control.FullScreen.min.js"></script>

    <script>
        // 1. Define your map styles
        const standardMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        });

        const topoMap = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, <a href="http://viewfinderpanoramas.org">SRTM</a> | Style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'
        });

        // 2. Initialize the Map
        const map = L.map('map', {
            fullscreenControl: true,
            fullscreenControlOptions: { position: 'topleft' },
            layers: [standardMap] 
        }).setView([51.1657, 10.4515], 5);

        // 3. Create the Layer Control menu
        const baseMaps = {
            "Standard Map": standardMap,
            "Topographic Map": topoMap
        };
        L.control.layers(baseMaps).addTo(map);

        // 4. Colors
        const bikeColor = '#e60000'; 
        const trainColor = '#3366ff'; 

        // 5. Manual Routes List (Added title and vote properties)
        const routes = [
            { file: 'day1.geojson', mode: 'bike', day: 1, date: 'Apr 15', title: '', vote: '' },
            { file: 'day2.geojson', mode: 'bike', day: 2, date: 'Apr 16', title: '', vote: '' },
            { file: 'day3.geojson', mode: 'bike', day: 3, date: 'Apr 17', title: '', vote: '' },
            { file: 'day4.geojson', mode: 'bike', day: 4, date: 'Apr 18', title: '', vote: '' },
            { file: 'TrainToHellerup.geojson', mode: 'train', day: 4, date: 'Apr 18' },
            { file: 'day5.geojson', mode: 'bike', day: 5, date: 'Apr 20', title: '', vote: '8' }, 
            { file: 'day6.geojson', mode: 'bike', day: 6, date: 'Apr 21', title: 'Ride in the original Zealand', vote: '9' },
            { file: 'day7.geojson', mode: 'bike', day: 7, date: 'Apr 22', title: 'In German territory', vote: '8' },
            { file: 'day8.geojson', mode: 'bike', day: 8, date: 'Apr 23', title: 'Stoicism maxxing to Hamburg', vote: '8' },
            { file: 'day9.geojson', mode: 'bike', day: 9, date: 'Apr 24', title: 'Riding on my last straw', vote: '2' },
            { file: 'day10.geojson', mode: 'bike', day: 10, date: 'Apr 25', title: 'Chilling in the nothingness', vote: '6.5' },
            { file: 'TrainToMunster.geojson', mode: 'train', day: 10, date: 'Apr 25' },
            { file: 'day11.geojson', mode: 'bike', day: 11, date: 'Apr 28', title: 'Random walk along the canal', vote: '7.5' },
            { file: 'day12.geojson', mode: 'bike', day: 12, date: 'Apr 30', title: 'At the border with hilly Europe', vote: '7.5' },
            { file: 'day13.geojson', mode: 'bike', day: 13, date: 'May 01', title: 'Up and down across three countries', vote: '8.5' },
            { file: 'day14.geojson', mode: 'bike', day: 14, date: 'May 02', title: 'Cars and clouds', vote: '6' },
            { file: 'daynull.geojson', mode: 'bike', day: 15, date: 'May 04', title: 'Zombie', vote: '0' },
            { file: 'day15.geojson', mode: 'bike', day: 16, date: 'May 05', title: 'Slowed down by rain and difficulties of life', vote: '8' },
            { file: 'day16.geojson', mode: 'bike', day: 17, date: 'May 06', title: 'Rivers and cows rivers and cows', vote: '9' },
            { file: 'day17.geojson', mode: 'bike', day: 18, date: 'May 07', title: 'Among the French', vote: '5' },
            { file: 'day18.geojson', mode: 'bike', day: 19, date: 'May 09', title: 'Les canals', vote: '7.5' },
            { file: 'day19.geojson', mode: 'bike', day: 20, date: 'May 10', title: 'Alsazia-Lorena', vote: '9' },
            { file: 'day20.geojson', mode: 'bike', day: 21, date: 'May 12', title: 'Straight lines', vote: '6.5' },
            { file: 'day21.geojson', mode: 'bike', day: 22, date: 'May 13', title: 'Le miserable', vote: '5' },
            { file: 'day22.geojson', mode: 'bike', day: 23, date: 'May 15', title: 'The beginning of the end', vote: '7' },
            { file: 'day23.geojson', mode: 'bike', day: 24, date: 'May 16', title: 'At the foot of the Alps', vote: '9' },
            { file: 'day24.geojson', mode: 'bike', day: 25, date: 'May 20', title: 'Teasing the mountains', vote: '8.5' },
            { file: 'day25.geojson', mode: 'bike', day: 26, date: 'May 21', title: 'Optional boss', vote: '9.5' },
            { file: 'day26.geojson', mode: 'bike', day: 27, date: 'May 22', title: 'The unforgiving heaven', vote: '9.5' },
            { file: 'day27.geojson', mode: 'bike', day: 28, date: 'May 23', title: 'Peak', vote: '10' },
            { file: 'day28.geojson', mode: 'bike', day: 29, date: 'May 24', title: 'Home is where your friends are', vote: '10' }
        ];

        let bounds = L.latLngBounds();

        // 6. Data Fetch, Jump-Cutter, and Drawing
        const routePromises = routes.map((route) => {
            return fetch(route.file)
                .then(response => {
                    if (!response.ok) throw new Error(`Could not load ${route.file}`);
                    return response.json();
                })
                .then(data => {
                    // --- JUMP-CUTTER LOGIC ---
                    const jumpThreshold = 12000; 

                    const splitLine = (coords) => {
                        let segments = [];
                        let currentSegment = [coords[0]];
                        for (let i = 1; i < coords.length; i++) {
                            const p1 = L.latLng(coords[i-1][1], coords[i-1][0]);
                            const p2 = L.latLng(coords[i][1], coords[i][0]);
                            if (map.distance(p1, p2) > jumpThreshold) {
                                if (currentSegment.length > 1) segments.push(currentSegment);
                                currentSegment = [coords[i]]; 
                            } else {
                                currentSegment.push(coords[i]);
                            }
                        }
                        if (currentSegment.length > 1) segments.push(currentSegment);
                        return segments;
                    };

                    if (data.features) {
                        data.features.forEach(feature => {
                            if (feature.geometry.type === 'LineString') {
                                feature.geometry.coordinates = splitLine(feature.geometry.coordinates);
                                feature.geometry.type = 'MultiLineString';
                            } else if (feature.geometry.type === 'MultiLineString') {
                                let newMulti = [];
                                feature.geometry.coordinates.forEach(line => {
                                    newMulti.push(...splitLine(line));
                                });
                                feature.geometry.coordinates = newMulti;
                            }
                        });
                    }

                    const isTrain = route.mode === 'train';
                    const routeColor = isTrain ? trainColor : bikeColor;
                    const dashArrayStyle = isTrain ? '10, 10' : '';

                    let routeDistanceMeters = 0;
                    let routeAscent = 0;
                    let routeDescent = 0;

                    // 7. Draw Lines and Calculate Metrics
                    const geoJsonLayer = L.geoJSON(data, {
                        style: function (feature) {
                            return {
                                color: routeColor,
                                weight: 6,
                                opacity: 0.8,
                                dashArray: dashArrayStyle,
                                lineCap: 'round'
                            };
                        },
                        onEachFeature: function (feature, layer) {
                            if (feature.geometry.type === 'LineString') {
                                const coords = feature.geometry.coordinates;
                                for (let i = 0; i < coords.length - 1; i++) {
                                    // Distance
                                    const p1 = L.latLng(coords[i][1], coords[i][0]);
                                    const p2 = L.latLng(coords[i+1][1], coords[i+1][0]);
                                    routeDistanceMeters += map.distance(p1, p2);
                                    
                                    // Elevation (GeoJSON format is [lng, lat, elevation])
                                    if (coords[i].length > 2 && coords[i+1].length > 2) {
                                        let eleDiff = coords[i+1][2] - coords[i][2];
                                        if (eleDiff > 0) routeAscent += eleDiff;
                                        else if (eleDiff < 0) routeDescent += Math.abs(eleDiff);
                                    }
                                }
                            } else if (feature.geometry.type === 'MultiLineString') {
                                const lines = feature.geometry.coordinates;
                                lines.forEach(coords => {
                                    for (let i = 0; i < coords.length - 1; i++) {
                                        // Distance
                                        const p1 = L.latLng(coords[i][1], coords[i][0]);
                                        const p2 = L.latLng(coords[i+1][1], coords[i+1][0]);
                                        routeDistanceMeters += map.distance(p1, p2);
                                        
                                        // Elevation
                                        if (coords[i].length > 2 && coords[i+1].length > 2) {
                                            let eleDiff = coords[i+1][2] - coords[i][2];
                                            if (eleDiff > 0) routeAscent += eleDiff;
                                            else if (eleDiff < 0) routeDescent += Math.abs(eleDiff);
                                        }
                                    }
                                });
                            }
                        }
                    }).addTo(map);

                    bounds.extend(geoJsonLayer.getBounds());

                    // 8. Add Start and End Circles (Popups Removed)
                    if (data.features && data.features.length > 0) {
                        const firstFeature = data.features[0];
                        const lastFeature = data.features[data.features.length - 1];

                        const firstLine = firstFeature.geometry.type === 'LineString' ? firstFeature.geometry.coordinates : firstFeature.geometry.coordinates[0];
                        const lastLine = lastFeature.geometry.type === 'LineString' ? lastFeature.geometry.coordinates : lastFeature.geometry.coordinates[lastFeature.geometry.coordinates.length - 1];

                        const startCoord = firstLine[0];
                        const endCoord = lastLine[lastLine.length - 1];

                        const circleStyle = {
                            radius: 3,
                            fillColor: routeColor, 
                            color: "#ffffff",      
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 1
                        };

                        // Bound popups removed from here
                        L.circleMarker([startCoord[1], startCoord[0]], circleStyle).addTo(map);
                        L.circleMarker([endCoord[1], endCoord[0]], circleStyle).addTo(map);
                    }

                    // Return the layer and data so we can build the popups chronologically
                    return {
                        route: route,
                        layer: geoJsonLayer,
                        distance: routeDistanceMeters / 1000,
                        ascent: routeAscent,
                        descent: routeDescent
                    };
                })
                .catch(error => console.error(error));
        });

        // 9. Build Popups and Calculate Cumulative Metrics
        Promise.all(routePromises).then((results) => {
            // Remove any failed fetches before processing
            const validResults = results.filter(item => item !== undefined);

            if (bounds.isValid()) {
                map.fitBounds(bounds);
            }

            // Sort by day to ensure the cumulative calculation is correct
            validResults.sort((a, b) => a.route.day - b.route.day);

            let cumulativeDistance = 0;
            let cumulativeAscent = 0;
            let cumulativeDescent = 0;

            validResults.forEach(item => {
                // Add biking stats to the cumulative totals
                if (item.route.mode === 'bike') {
                    cumulativeDistance += item.distance;
                    cumulativeAscent += item.ascent;
                    cumulativeDescent += item.descent;
                }

                let popupContent = `<b>Day ${item.route.day}</b>`;
                
                // Add Title and Vote if they exist
                if (item.route.title) {
                    popupContent += `<br><b>${item.route.title}</b>`;
                }
                if (item.route.vote) {
                    popupContent += `<br><small><b>Vote:</b> ${item.route.vote}</small>`;
                }

                popupContent += `<br><small><b>Date:</b> ${item.route.date}</small>`;
                popupContent += `<br><small><b>Distance:</b> ${item.distance.toFixed(1)} km</small>`;
                
                // Only display Daily Ascent/Descent if the GeoJSON has 3D coordinates
                if (item.ascent > 0 || item.descent > 0) {
                    popupContent += `<br><small><b>Ascent:</b> ${Math.round(item.ascent)} m</small>`;
                    popupContent += `<br><small><b>Descent:</b> ${Math.round(item.descent)} m</small>`;
                }
                
                // Divider line for cumulative stats
                popupContent += `<hr style="margin: 6px 0; border: 0; border-top: 1px solid #ccc;">`;
                
                popupContent += `<small><b>Total distance:</b> ${cumulativeDistance.toFixed(1)} km</small>`;
                
                // Only display Cumulative Ascent/Descent if there is 3D data contributing to it
                if (cumulativeAscent > 0 || cumulativeDescent > 0) {
                    popupContent += `<br><small><b>Total ascent:</b> ${Math.round(cumulativeAscent)} m</small>`;
                    popupContent += `<br><small><b>Total descent:</b> ${Math.round(cumulativeDescent)} m</small>`;
                }

                // Bind the completed popup to the line
                item.layer.bindPopup(popupContent);
            });
        });

    </script>
</body>
</html>
